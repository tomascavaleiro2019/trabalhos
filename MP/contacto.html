<html>
	<head>
		<title>Contacto / Sobre</title>
		<link rel="stylesheet" href="style.css">
	</head>
<body>
    <header class="navbar">
        <nav>
            <a href="file:///C:/Users/tomas/OneDrive/Desktop/MP/index%20(1)%20(1).html">Início</a>
            <a href="file:///C:/Users/tomas/OneDrive/Desktop/MP/contacto.html">Contacto/Sobre</a>
        </nav>
    </header>

    <main class="contacto">
        <div class="contacto-inner">
            <form class="formulario" action="#" method="post">
                <h2>Entre em Contacto</h2>

                <div class="campo-form">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Introduza o seu nome" required>
                </div>

                <div class="campo-form">
                    <label for="email">Endereço de Email</label>
                    <input type="email" id="email" name="email" placeholder="Introduza o seu email" required>
                </div>

                <div class="campo-form">
                    <label for="servico">Tipo de Serviço</label>
                    <select id="servico" name="servico">
                        <option value="web">Desenvolvimento Web</option>
                        <option value="design">Web Design</option>
                        <option value="outro">Outro assunto</option>
                    </select>
                </div>

                <div class="campo-form">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva aqui a sua mensagem..." rows="4" required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>

            <aside class="info-contacto">
                <p><strong>Email:</strong> tomascosta.217267@idjv.pt</p>
                <p><strong>Tel:</strong> +351 938522942</p>
            </aside>
        </div>
    </main>

    <footer>
        <p> 2026 Tomás Costa — Módulo: Desenvolvimento de Páginas Web Estáticas (TGPSI)</p>
    </footer>
</body>
</html>
